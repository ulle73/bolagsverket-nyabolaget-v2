name: Daily Import

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: Which import command to run
        type: choice
        required: true
        default: daily
        options:
          - daily
          - range
          - process_admin_requests
      from_date:
        description: Start date for range runs (YYYY-MM-DD)
        type: string
        required: false
      to_date:
        description: End date for range runs (YYYY-MM-DD)
        type: string
        required: false
      lookback_days:
        description: Lookback window for daily runs
        type: string
        required: false
        default: '10'
      verify_publication:
        description: Verify snapshot freshness after run
        type: boolean
        required: false
        default: false

concurrency:
  group: foretagslistor-daily-import
  cancel-in-progress: true

jobs:
  sync-scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_DIR: ${{ github.workspace }}/.runtime-data
      SCB_PASSWORD: ${{ secrets.SCB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ARCHIVE_URL: ${{ secrets.SUPABASE_ARCHIVE_URL }}
      SUPABASE_ARCHIVE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_ARCHIVE_SERVICE_ROLE_KEY }}
      SCB_PFX_PATH: ${{ github.workspace }}/.runtime/scb-client.pfx
      SYNC_LOOKBACK_DAYS: '10'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate persistent data directory
        shell: bash
        run: |
          test -n "$DATA_DIR"
          mkdir -p "$DATA_DIR/raw" "$DATA_DIR/exports" "$DATA_DIR/state"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore SCB certificate
        shell: bash
        run: |
          mkdir -p "$(dirname "$SCB_PFX_PATH")"
          echo "${{ secrets.SCB_PFX_BASE64 }}" | base64 --decode > "$SCB_PFX_PATH"

      - name: Queue scheduled daily admin request
        run: npm run queue:scheduled-daily-request

      - name: Process queued admin requests
        run: npm run process:admin-requests

      - name: Verify latest published snapshot freshness
        if: always()
        run: npm run verify:publication -- --max-age-days=9

  sync-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_DIR: ${{ github.workspace }}/.runtime-data
      SCB_PASSWORD: ${{ secrets.SCB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ARCHIVE_URL: ${{ secrets.SUPABASE_ARCHIVE_URL }}
      SUPABASE_ARCHIVE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_ARCHIVE_SERVICE_ROLE_KEY }}
      SCB_PFX_PATH: ${{ github.workspace }}/.runtime/scb-client.pfx
      SYNC_LOOKBACK_DAYS: '10'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runtime data directory
        shell: bash
        run: |
          test -n "$DATA_DIR"
          mkdir -p "$DATA_DIR/raw" "$DATA_DIR/exports" "$DATA_DIR/state"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore SCB certificate
        shell: bash
        run: |
          mkdir -p "$(dirname "$SCB_PFX_PATH")"
          echo "${{ secrets.SCB_PFX_BASE64 }}" | base64 --decode > "$SCB_PFX_PATH"

      - name: Run manual daily sync
        if: inputs.run_mode == 'daily'
        run: npm run sync:daily -- --lookback=${{ inputs.lookback_days }}

      - name: Run manual range sync
        if: inputs.run_mode == 'range'
        run: npm run sync:range -- --from=${{ inputs.from_date }} --to=${{ inputs.to_date }}

      - name: Process admin requests on demand
        if: inputs.run_mode == 'process_admin_requests'
        run: npm run process:admin-requests

      - name: Verify latest published snapshot freshness
        if: inputs.verify_publication == true || inputs.verify_publication == 'true'
        run: npm run verify:publication -- --max-age-days=9
