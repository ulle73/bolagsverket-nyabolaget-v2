name: Daily Import

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: Which import command to run
        type: choice
        required: true
        default: daily
        options:
          - daily
          - range
          - process_admin_requests
      from_date:
        description: Start date for range runs (YYYY-MM-DD)